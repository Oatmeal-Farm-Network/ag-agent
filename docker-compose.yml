version: '3.8'

services:
  # The Python Backend Service
  backend:
    build:
      context: . # Use the Dockerfile in the current directory
      dockerfile: Dockerfile
    ports:
      - "8000:8000" # Expose port 8000 for the API
    env_file:
       - ./.env
    environment:
      - DOCKER_COMPOSE_ENV=true  # Flag to indicate Docker Compose environment
      - KNOWLEDGE_RETRIEVER_URL=http://knowledge-retriever:8000  # Local service URL
      - ENVIRONMENT=development
    depends_on:
      - knowledge-retriever  # Backend depends on knowledge retriever being ready

  # Knowledge Retriever Microservice
  knowledge-retriever:
    build:
      context: ./knowledge-retriever # Directory containing your knowledge_retriever.py and Dockerfile
      dockerfile: Dockerfile
    ports:
      - "8001:8000" # Expose on host port 8001, container port 8000
    environment:
      # Azure Search Configuration
      - AZURE_SEARCH_ENDPOINT=${AZURE_SEARCH_ENDPOINT}
      - AZURE_SEARCH_KEY=${AZURE_SEARCH_KEY}
      - KNOWLEDGE_BASE_INDEX_NAMES=${KNOWLEDGE_BASE_INDEX_NAMES}
      # Azure OpenAI Configuration  
      - AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # The React Frontend Service (served with Nginx)
  frontend:
    build:
      context: ./frontend # Look for a Dockerfile in the ./frontend directory
      args:
        REACT_APP_BACKEND_HOST: ${REACT_APP_BACKEND_HOST:-http://localhost:8000}
        REACT_APP_KNOWLEDGE_RETRIEVER_HOST: ${REACT_APP_KNOWLEDGE_RETRIEVER_HOST:-http://localhost:8001}
        REACT_APP_KNOWLEDGE_RETRIEVER_HOST_PROD: ${REACT_APP_KNOWLEDGE_RETRIEVER_HOST_PROD:-}
        REACT_APP_KNOWLEDGE_RETRIEVER_HOST_DEV: ${REACT_APP_KNOWLEDGE_RETRIEVER_HOST_DEV:-http://localhost:8001}
        REACT_APP_BACKEND_HOST_PROD: ${REACT_APP_BACKEND_HOST_PROD:-}
        REACT_APP_BACKEND_HOST_DEV: ${REACT_APP_BACKEND_HOST_DEV:-http://localhost:8000}
        REACT_APP_ENVIRONMENT: ${REACT_APP_ENVIRONMENT:-development}
    volumes:
      # Mount our custom nginx config.
      # This overwrites the default config inside the container.
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "3001:80" # Map host port 3001 to the container's port 80
    depends_on:
      - backend # Tells Docker to start the backend before the frontend
      - knowledge-retriever # Also depend on knowledge retriever